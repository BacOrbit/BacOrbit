<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>التذكير بالمكتسبات - BacOrbit</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0d0d0d;
color:#fff;
min-height:100vh;
overflow-x:hidden;
}

header{
text-align:center;
padding:30px;
border-bottom:1px solid #1aff66;
background:#111;
}

.logo{
font-size:40px;
font-weight:bold;
color:#1aff66;
letter-spacing:2px;
}

.hero{
text-align:center;
padding:50px 20px 25px;
}

.hero h1{
font-size:40px;
margin-bottom:12px;
color:#1aff66;
}

.hero p{
font-size:17px;
color:#bdbdbd;
}

.score-bar{
max-width:650px;
margin:0 auto 20px;
display:flex;
justify-content:space-between;
padding:0 10px;
color:#bdbdbd;
font-size:15px;
font-weight:bold;
}

.score-bar span{
color:#1aff66;
}

.quiz-wrap{
max-width:650px;
margin:auto;
padding:10px 20px 60px;
}

.quiz-card{
background:#161616;
border:3px solid #1aff66;
border-radius:22px;
padding:35px;
transition:.25s;
box-shadow:0 12px 35px rgba(0,0,0,.45);
}

.quiz-card.shake{
animation:shake .4s;
}

.quiz-card.flash-red{
border-color:#ff4d4d;
box-shadow:0 0 30px rgba(255,77,77,.5);
}

.quiz-card.flash-green{
border-color:#1aff66;
box-shadow:0 0 30px rgba(26,255,102,.55);
}

@keyframes shake{
0%{transform:translateX(0);}
20%{transform:translateX(-10px);}
40%{transform:translateX(10px);}
60%{transform:translateX(-8px);}
80%{transform:translateX(8px);}
100%{transform:translateX(0);}
}

.badge{
display:inline-block;
background:#0d0d0d;
border:1px solid #1aff66;
color:#1aff66;
font-size:13px;
font-weight:bold;
padding:6px 16px;
border-radius:20px;
margin-bottom:18px;
}

.question-text{
font-size:20px;
line-height:1.7;
margin-bottom:28px;
min-height:60px;
}

.options{
display:flex;
flex-direction:column;
gap:14px;
}

.option-btn{
background:#0d0d0d;
border:2px solid #333;
color:#fff;
padding:15px 18px;
border-radius:14px;
font-size:16px;
text-align:right;
cursor:pointer;
transition:.2s;
font-family:inherit;
}

.option-btn:hover:not(:disabled){
border-color:#1aff66;
transform:translateY(-3px);
}

.option-btn:disabled{
cursor:default;
}

.option-btn.correct-answer{
border-color:#1aff66;
background:#0f2b1a;
color:#1aff66;
font-weight:bold;
}

.option-btn.wrong-answer{
border-color:#ff4d4d;
background:#2b0f0f;
color:#ff4d4d;
font-weight:bold;
}

.back{
display:block;
width:250px;
margin:10px auto 40px;
padding:15px;
text-align:center;
background:#1aff66;
color:black;
font-weight:bold;
text-decoration:none;
border-radius:12px;
transition:.25s;
}

.back:hover{
transform:scale(1.03);
}

footer{
text-align:center;
padding:25px;
color:#888;
}

/* --- banner --- */

.banner-overlay{
position:fixed;
inset:0;
display:flex;
align-items:center;
justify-content:center;
pointer-events:none;
z-index:2000;
}

.banner{
padding:22px 45px;
border-radius:20px;
font-size:32px;
font-weight:bold;
text-align:center;
opacity:0;
transform:scale(.7);
transition:transform .25s, opacity .25s;
box-shadow:0 0 40px rgba(0,0,0,.6);
}

.banner.show{
opacity:1;
transform:scale(1);
}

.banner.win{
background:#0f2b1a;
border:3px solid #1aff66;
color:#1aff66;
}

.banner.lose{
background:#2b0f0f;
border:3px solid #ff4d4d;
color:#ff4d4d;
}

@media(max-width:600px){
.hero h1{
font-size:30px;
}
.quiz-card{
padding:24px;
}
.question-text{
font-size:18px;
}
.banner{
font-size:24px;
padding:16px 28px;
}
}
</style>

</head>

<div class="logo">BacOrbit</div>

<footer>

<div class="banner-overlay">
<div class="banner" id="banner"></div>

/* ---------- shuffle ---------- */
function shuffle(arr){
const a = arr.slice();
for(let i = a.length - 1; i > 0; i--){
const j = Math.floor(Math.random() * (i + 1));
[a[i], a[j]] = [a[j], a[i]];
}
return a;
}

let order = shuffle(questions.map((_, i) => i));
let current = 0;
let score = 0;
let locked = false;

const quizCard = document.getElementById("quizCard");
const subjectBadge = document.getElementById("subjectBadge");
const questionText = document.getElementById("questionText");
const optionsWrap = document.getElementById("optionsWrap");
const banner = document.getElementById("banner");
const qIndexEl = document.getElementById("qIndex");
const scoreValEl = document.getElementById("scoreVal");

function loadQuestion(){

if(current >= order.length){
order = shuffle(questions.map((_, i) => i));
current = 0;
}

locked = false;
quizCard.classList.remove("flash-red","flash-green","shake");

const item = questions[order[current]];

subjectBadge.textContent = item.subject;
questionText.textContent = item.q;
qIndexEl.textContent = current + 1;

optionsWrap.innerHTML = "";

item.options.forEach((opt, idx) => {
const btn = document.createElement("button");
btn.className = "option-btn";
btn.textContent = opt;
btn.onclick = () => handleAnswer(idx, item, btn);
optionsWrap.appendChild(btn);
});

}

function showBanner(text, type){
banner.textContent = text;
banner.className = "banner show " + type;
setTimeout(() => {
banner.classList.remove("show");
}, 1100);
}

function handleAnswer(idx, item, btn){

if(locked) return;
locked = true;

const allBtns = optionsWrap.querySelectorAll(".option-btn");
allBtns.forEach(b => b.disabled = true);

if(idx === item.correct){

score++;
scoreValEl.textContent = score;
btn.classList.add("correct-answer");
quizCard.classList.add("flash-green");
showBanner("زعيييم، كمل فيها 💪", "win");

}else{

btn.classList.add("wrong-answer");
quizCard.classList.add("flash-red","shake");
allBtns[item.correct].classList.add("correct-answer");
showBanner("زير روحك 😅", "lose");

}

setTimeout(() => {
current++;
loadQuestion();
}, 1500);

}

loadQuestion();

</script>

</body>
</html>
