<script>
/* ══ صفحة «المواضيع المتنوعة» (الفيزياء) — صفحة واحدة مشتركة بين الشعب الثلاث ══
   العرض الأول:  T_physic.html?b=<شعبة>            ← بطاقات الفصول الثلاثة
   العرض الثاني: T_physic.html?b=<شعبة>&c=<1|2|3>  ← بطاقات ملفات الفصل المختار
   أسماء المجلدات S1 / S2 / S3 تُستخدم داخل المسارات فقط ولا تظهر في الواجهة.
   تُرسم البطاقات متزامنًا أثناء تحميل الصفحة، ليعمل معها تمييز المواضيع المزارة
   و«الدراسة لاحقًا» تمامًا كباقي صفحات المواضيع. */
(function () {
'use strict';

/* عدد الملفات الفعلي لكل شعبة/فصل (مأخوذ من لقطات مجلدات T_physic؛ الرياضيات والتقني رياضي يشتركان في مجلد «math x tech»).
   المسار: T_physic/S{n}/{مجلد الشعبة}/({i}).pdf */
var BRANCHES = {
    math: { label: 'شعبة الرياضيات',        back: '1_math.html',      dir: 'math x tech', counts: { 1: 8,  2: 12, 3: 27 } },
    scie: { label: 'شعبة العلوم التجريبية', back: '1_science.html',   dir: 'scie',        counts: { 1: 14, 2: 20, 3: 36 } },
    tech: { label: 'شعبة تقني رياضي',       back: '1_technical.html', dir: 'math x tech', counts: { 1: 8,  2: 12, 3: 27 } }
};

var CHAPTERS = {
    1: { name: 'الفصل الأول',  dir: 'S1' },
    2: { name: 'الفصل الثاني', dir: 'S2' },
    3: { name: 'الفصل الثالث', dir: 'S3' }
};

var DL_SVG = '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>';

var params = new URLSearchParams(location.search);
var b = params.get('b');
var c = params.get('c');

var grid = document.getElementById('tmGrid');
var titleEl = document.getElementById('tmTitle');
var subEl = document.getElementById('tmSub');
var backEl = document.getElementById('tmBack');

document.title = 'المواضيع المتنوعة - الفيزياء - BacOrbit';

if (!Object.prototype.hasOwnProperty.call(BRANCHES, b)) {
    subEl.textContent = 'تعذّر تحديد الشعبة. ارجع إلى الصفحة الرئيسية واختر شعبتك.';
    return;
}

var branch = BRANCHES[b];

if (c && Object.prototype.hasOwnProperty.call(CHAPTERS, c)) {
    /* ── العرض الثاني: ملفات الفصل ── */
    var chapter = CHAPTERS[c];
    var total = branch.counts[c];

    titleEl.textContent = 'المواضيع المتنوعة — ' + chapter.name;
    subEl.textContent = branch.label + ' · اختر الموضوع الذي تريد مراجعته';
    backEl.setAttribute('href', 'T_physic.html?b=' + b);
    backEl.textContent = 'العودة إلى الفصول';

    var html = '';
    for (var i = 1; i <= total; i++) {
        var file = '(' + i + ').pdf';
        var path = 'T_physic/' + chapter.dir + '/' + branch.dir + '/' + file;
        html +=
            '<div class="card topic-card" onclick="window.open(\'' + path + '\', \'_blank\')">' +
                '<h2>📄 الموضوع ' + i + '</h2>' +
                '<button class="topic-download-btn" type="button" onclick="downloadTopic(event, \'' + path + '\', \'' + file + '\')" aria-label="تنزيل الموضوع ' + i + '">' +
                    DL_SVG + '<span>تنزيل الموضوع</span>' +
                '</button>' +
            '</div>';
    }
    grid.innerHTML = html;
} else {
    /* ── العرض الأول: بطاقات الفصول الثلاثة ── */
    subEl.textContent = branch.label + ' · اختر الفصل';
    backEl.setAttribute('href', branch.back);
    backEl.textContent = 'العودة إلى المادة';

    [1, 2, 3].forEach(function (n) {
        var card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = '<h2>📘 ' + CHAPTERS[n].name + '</h2>';
        card.addEventListener('click', function () {
            window.location.href = 'T_physic.html?b=' + b + '&c=' + n;
        });
        grid.appendChild(card);
    });
}

})();
</script>
