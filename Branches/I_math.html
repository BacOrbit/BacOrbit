/* ══ إضافات خاصة بصفحة «سلاسل التمارين» فقط (لا تعدّل style.css المشترك) ══ */

.im-wrap {
    max-width: 900px;
    margin: 0 auto;
    padding: 0 20px 6px;
}

.im-units {
    display: flex;
    flex-direction: column;
    gap: 16px;
}

.im-unit-card {
    display: block;
    width: 100%;
    background: var(--card-bg);
    border: 2px solid var(--border);
    border-radius: 18px;
    padding: 24px 22px;
    text-align: center;
    color: var(--text);
    font-size: 19px;
    font-weight: bold;
    font-family: inherit;
    cursor: pointer;
    transition: transform 0.25s ease, box-shadow 0.25s ease, background-color 0.35s ease, border-color 0.35s ease, color 0.35s ease;
    animation: forumCardIn 0.35s ease both;
}

.im-unit-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 0 22px var(--accent-soft);
}

.im-unit-card.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #000;
    cursor: default;
    animation: forumCardIn 0.4s ease both;
}

.im-unit-card.active:hover {
    transform: none;
    box-shadow: 0 8px 24px var(--accent-soft);
}

.im-unit-card.im-hidden {
    display: none;
}

.im-back-btn {
    display: none;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin: 18px auto 0;
    padding: 12px 26px;
    background: transparent;
    border: 2px solid var(--accent);
    color: var(--accent);
    border-radius: 12px;
    font-size: 14.5px;
    font-weight: bold;
    font-family: inherit;
    cursor: pointer;
    transition: background-color 0.25s ease, box-shadow 0.25s ease, transform 0.2s ease;
    animation: forumCardIn 0.3s ease both;
}

.im-back-btn:hover {
    background: var(--accent-glow);
    box-shadow: 0 0 16px var(--accent-glow);
    transform: translateY(-2px);
}

@media (max-width: 600px) {
    .im-unit-card { padding: 20px 16px; font-size: 16.5px; border-radius: 15px; }
    .im-back-btn { width: 100%; padding: 13px; }
}
</style>

<script>
(function () {
'use strict';

/* بيانات الوحدات: المفتاح، الاسم الظاهر، بادئة اسم الملف الفعلي داخل
   مجلد I_math، وعدد الصور الحقيقي لكل وحدة (تم التحقق منه على الملفات
   الفعلية الموجودة في المجلد، وليس افتراضًا). */
var UNITS = [
    { key: 'exp',  name: '📈 الدوال الأسية',           prefix: 'اسية',     count: 41 },
    { key: 'log',  name: '📉 الدوال اللوغاريتمية',    prefix: 'لوغارتمية', count: 54 },
    { key: 'seq',  name: '📐 المتتاليات',            prefix: 'متتاليات', count: 45 },
    { key: 'num',  name: '➗ الأعداد والحساب',         prefix: 'z',        count: 62 },
    { key: 'prob', name: '🎲 الاحتمالات',             prefix: 'احتمالات', count: 25 },
    { key: 'cplx', name: '🔢 الأعداد المركبة',        prefix: 'مركبة',    count: 62 }
];

var unitsWrap = document.getElementById('imUnits');
var backBtn = document.getElementById('imBackBtn');
var lessonsEl = document.getElementById('imLessons');
var cards = [];

function buildCards() {
    UNITS.forEach(function (u) {
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'im-unit-card';
        btn.textContent = u.name;
        btn.dataset.key = u.key;
        btn.addEventListener('click', function () { selectUnit(u); });
        unitsWrap.appendChild(btn);
        cards.push(btn);
    });
}

function renderImages(u) {
    lessonsEl.innerHTML = '';
    var plainName = u.name.replace(/^\S+\s/, '');
    for (var i = 1; i <= u.count; i++) {
        var div = document.createElement('div');
        div.className = 'lesson';

        var img = document.createElement('img');
        img.src = 'I_math/' + u.prefix + i + '.jpg';
        img.alt = plainName + ' - تمرين ' + i;
        img.loading = (i === 1) ? 'eager' : 'lazy';

        div.appendChild(img);
        lessonsEl.appendChild(div);
    }
    /* إعادة تفعيل عارض/تنزيل صور الدروس المشترك على الصور المُضافة حديثًا */
    if (typeof window.bacEnhanceLessonImages === 'function') {
        window.bacEnhanceLessonImages();
    }
}

function toggleZoomBar(show) {
    var bar = document.getElementById('bacLessonZoomBar');
    if (bar) bar.style.display = show ? 'flex' : 'none';
}

function selectUnit(u) {
    cards.forEach(function (c) {
        if (c.dataset.key === u.key) {
            c.classList.add('active');
            c.classList.remove('im-hidden');
        } else {
            c.classList.add('im-hidden');
        }
    });
    backBtn.style.display = 'inline-flex';
    renderImages(u);
    toggleZoomBar(true);
}

function goBack() {
    cards.forEach(function (c) {
        c.classList.remove('active', 'im-hidden');
    });
    backBtn.style.display = 'none';
    lessonsEl.innerHTML = '';
    toggleZoomBar(false);
}

function init() {
    buildCards();
    backBtn.addEventListener('click', goBack);
    toggleZoomBar(false);
}

if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
} else {
    init();
}

})();
</script>
