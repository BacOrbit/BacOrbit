}

.im-unit-card:hover {

}

.im-unit-card.active {

    cursor: pointer;
    animation: forumCardIn 0.4s ease both;
}

<script>
(function () {
'use strict';

/* بيانات الوحدات: المفتاح، الاسم الظاهر، بادئة اسم الملف الفعلي داخل
   مجلد I_math، وعدد الصور الحقيقي لكل وحدة (تم التحقق منه على الملفات
   الفعلية الموجودة في المجلد، وليس افتراضًا). */
var UNITS = [
    { key: 'exp',  name: '📈 الدوال الأسية',           prefix: 'اسية',     count: 41 },
    { key: 'log',  name: '📉 الدوال اللوغاريتمية',    prefix: 'لوغارتمية', count: 54 },
    { key: 'seq',  name: '📐 المتتاليات',            prefix: 'متتاليات', count: 45 },
    { key: 'num',  name: '➗ الأعداد والحساب',         prefix: 'z',        count: 62 },
    { key: 'prob', name: '🎲 الاحتمالات',             prefix: 'احتمالات', count: 25 },
    { key: 'cplx', name: '🔢 الأعداد المركبة',        prefix: 'مركبة',    count: 62 }
];

var unitsWrap = document.getElementById('imUnits');
var lessonsEl = document.getElementById('imLessons');
var cards = [];

function buildCards() {
    UNITS.forEach(function (u) {
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'im-unit-card';
        btn.textContent = u.name;
        btn.dataset.key = u.key;
        btn.addEventListener('click', function () { openUnit(u); });
        unitsWrap.appendChild(btn);
        cards.push(btn);
    });
}

function toggleZoomBar(show) {
    var bar = document.getElementById('bacLessonZoomBar');
    if (bar) bar.style.display = show ? 'flex' : 'none';
}

function buildSources(u, plainName) {
    var list = [];
    for (var i = 1; i <= u.count; i++) {
        list.push({ src: 'I_math/' + u.prefix + i + '.jpg', alt: plainName + ' - تمرين ' + i });
    }
    return list;
}

function openUnit(u) {
    cards.forEach(function (c) { c.classList.toggle('active', c.dataset.key === u.key); });
    var h = document.querySelector('.hero h1');
    var pageName = h ? h.textContent.replace(/^[^\u0600-\u06FFA-Za-z0-9]+/, '').trim() : '';
    var plainName = u.name.replace(/^\S+\s/, '');
    var title = pageName ? pageName + ' — ' + plainName : plainName;
    window.bacOpenReader({ type: 'images', title: title, sources: buildSources(u, plainName), start: 0, fileName: title + '.pdf' });
}

function init() {
    buildCards();
    toggleZoomBar(false);
}

if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
} else {
    init();
}

})();
</script>
