.pf-wrap {
    max-width: 900px;
    margin: 0 auto;
    padding: 0 20px 6px;
}

.pf-units {
    display: flex;
    flex-direction: column;
    gap: 16px;
}

.pf-unit-card {
    display: block;
    width: 100%;
    background: var(--card-bg);
    border: 2px solid var(--border);
    border-radius: 18px;
    padding: 24px 22px;
    text-align: center;
    color: var(--text);
    font-size: 19px;
    font-weight: bold;
    font-family: inherit;
    cursor: pointer;
    transition: transform 0.25s ease, box-shadow 0.25s ease, background-color 0.35s ease, border-color 0.35s ease, color 0.35s ease;
    animation: forumCardIn 0.35s ease both;
}

.pf-unit-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 0 22px var(--accent-soft);
}

.pf-unit-card.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #000;
    cursor: default;
    animation: forumCardIn 0.4s ease both;
}

.pf-unit-card.active:hover {
    transform: none;
    box-shadow: 0 8px 24px var(--accent-soft);
}

.pf-unit-card.pf-hidden {
    display: none;
}

.pf-back-btn {
    display: none;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin: 18px auto 0;
    padding: 12px 26px;
    background: transparent;
    border: 2px solid var(--accent);
    color: var(--accent);
    border-radius: 12px;
    font-size: 14.5px;
    font-weight: bold;
    font-family: inherit;
    cursor: pointer;
    transition: background-color 0.25s ease, box-shadow 0.25s ease, transform 0.2s ease;
    animation: forumCardIn 0.3s ease both;
}

.pf-back-btn:hover {
    background: var(--accent-glow);
    box-shadow: 0 0 16px var(--accent-glow);
    transform: translateY(-2px);
}
</style>

<script>
(function () {
'use strict';

/* الصور تُعرض مباشرة بلا بطاقات وسيطة، بنفس أسماء الملفات الفعلية داخل مجلد P_french/ */
var FILES = ['compte rendu.png', 'compte rendu (2).png', 'compte rendu (3).png', 'compte rendu (4).png'];

var lessonsEl = document.getElementById('pfLessons');

function renderImages() {
    FILES.forEach(function (fileName, idx) {
        var div = document.createElement('div');
        div.className = 'lesson';

        var img = document.createElement('img');
        img.src = 'P_french/' + fileName;
        img.alt = 'فقرات جاهزة - اللغة الفرنسية - ' + (idx + 1);
        img.loading = (idx === 0) ? 'eager' : 'lazy';

        div.appendChild(img);
        lessonsEl.appendChild(div);
    });
    /* تفعيل عارض/تنزيل صور الدروس المشترك على الصور المُضافة */
    if (typeof window.bacEnhanceLessonImages === 'function') {
        window.bacEnhanceLessonImages();
    }
}

if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', renderImages);
} else {
    renderImages();
}

})();
</script>
