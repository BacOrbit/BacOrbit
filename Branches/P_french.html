   نفس تنسيقات صفحة P_english.html حرفيًا، بادئة الأصناف فقط تغيّرت (pf بدل pe)

.pf-wrap {
    max-width: 900px;
    margin: 0 auto;
    padding: 0 20px 6px;
}

.pf-units {
    display: flex;
    flex-direction: column;
    gap: 16px;
}

.pf-unit-card {
    display: block;
    width: 100%;
    background: var(--card-bg);
    border: 2px solid var(--border);
    border-radius: 18px;
    padding: 24px 22px;
    text-align: center;
    color: var(--text);
    font-size: 19px;
    font-weight: bold;
    font-family: inherit;
    cursor: pointer;
    transition: transform 0.25s ease, box-shadow 0.25s ease, background-color 0.35s ease, border-color 0.35s ease, color 0.35s ease;
    animation: forumCardIn 0.35s ease both;
}

.pf-unit-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 0 22px var(--accent-soft);
}

.pf-unit-card.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #000;
    cursor: default;
    animation: forumCardIn 0.4s ease both;
}

.pf-unit-card.active:hover {
    transform: none;
    box-shadow: 0 8px 24px var(--accent-soft);
}

.pf-unit-card.pf-hidden {
    display: none;
}

.pf-back-btn {
    display: none;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin: 18px auto 0;
    padding: 12px 26px;
    background: transparent;
    border: 2px solid var(--accent);
    color: var(--accent);
    border-radius: 12px;
    font-size: 14.5px;
    font-weight: bold;
    font-family: inherit;
    cursor: pointer;
    transition: background-color 0.25s ease, box-shadow 0.25s ease, transform 0.2s ease;
    animation: forumCardIn 0.3s ease both;
}

.pf-back-btn:hover {
    background: var(--accent-glow);
    box-shadow: 0 0 16px var(--accent-glow);
    transform: translateY(-2px);
}
</style>

<script>
(function () {
'use strict';

/* بيانات الوحدات: المفتاح، الاسم الظاهر، وقائمة أسماء الصور.
   ⚠️ ضع صور كل مشروع داخل مجلد "P_french/" (بجانب هذا الملف مباشرة،
   بنفس مستوى مجلد "P_english/") وبنفس الأسماء المذكورة أدناه بالضبط
   (حسّاسة لحالة الأحرف). لإضافة صفحة/فقرة جديدة لأي مشروع، فقط أضف
   اسم الصورة التالية إلى مصفوفة "files" الخاصة به. */
var UNITS = [
    {
        key: 'histoire',
        name: '📜 Projet 1 : Le texte d\'histoire',
        files: ['histoire (1).png', 'histoire (2).png']
    },
    {
        key: 'debat',
        name: '💬 Projet 2 : Le débat d\'idées',
        files: ['debat (1).png', 'debat (2).png']
    },
    {
        key: 'appel',
        name: '📢 Projet 3 : L\'appel',
        files: ['appel (1).png', 'appel (2).png']
    }
];

var unitsWrap = document.getElementById('pfUnits');
var backBtn = document.getElementById('pfBackBtn');
var lessonsEl = document.getElementById('pfLessons');
var cards = [];

function buildCards() {
    UNITS.forEach(function (u) {
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'pf-unit-card';
        btn.textContent = u.name;
        btn.dataset.key = u.key;
        btn.addEventListener('click', function () { selectUnit(u); });
        unitsWrap.appendChild(btn);
        cards.push(btn);
    });
}

function renderImages(u) {
    lessonsEl.innerHTML = '';
    var plainName = u.name.replace(/^\S+\s/, '');
    u.files.forEach(function (fileName, idx) {
        var div = document.createElement('div');
        div.className = 'lesson';

        var img = document.createElement('img');
        img.src = 'P_french/' + fileName;
        img.alt = plainName + ' - فقرة ' + (idx + 1);
        img.loading = (idx === 0) ? 'eager' : 'lazy';

        div.appendChild(img);
        lessonsEl.appendChild(div);
    });
    /* إعادة تفعيل عارض/تنزيل صور الدروس المشترك على الصور المُضافة حديثًا */
    if (typeof window.bacEnhanceLessonImages === 'function') {
        window.bacEnhanceLessonImages();
    }
}

function toggleZoomBar(show) {
    var bar = document.getElementById('bacLessonZoomBar');
    if (bar) bar.style.display = show ? 'flex' : 'none';
}

function selectUnit(u) {
    cards.forEach(function (c) {
        if (c.dataset.key === u.key) {
            c.classList.add('active');
            c.classList.remove('pf-hidden');
        } else {
            c.classList.add('pf-hidden');
        }
    });
    backBtn.style.display = 'inline-flex';
    renderImages(u);
    toggleZoomBar(true);
}

function goBack() {
    cards.forEach(function (c) {
        c.classList.remove('active', 'pf-hidden');
    });
    backBtn.style.display = 'none';
    lessonsEl.innerHTML = '';
    toggleZoomBar(false);
}

function init() {
    buildCards();
    backBtn.addEventListener('click', goBack);
    toggleZoomBar(false);
}

if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
} else {
    init();
}

})();
</script>
