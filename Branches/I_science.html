}

.is-unit-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 0 22px var(--accent-soft);
}

.is-unit-card.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #000;
    cursor: pointer;
    animation: forumCardIn 0.4s ease both;
}

.is-unit-card.active:hover {
    transform: none;
    box-shadow: 0 8px 24px var(--accent-soft);

<script>
(function () {
'use strict';

/* بيانات الوحدات: المفتاح، الاسم الظاهر، بادئة اسم الملف الفعلي داخل
   مجلد I_science، وعدد الصور الحقيقي لكل وحدة (تم التحقق منه على الملفات
   الفعلية الموجودة في المجلد، وليس افتراضًا). الترتيب مطابق للترتيب
   المطلوب تمامًا. */
var UNITS = [
    { key: 'protein_struct',  name: '🧬 تركيب البروتين',                                    prefix: 'تركيب البروتين',                      count: 95 },
    { key: 'protein_func',    name: '🔗 العلاقة بين بنية ووظيفة البروتين',                   prefix: 'العلاقة بين بنية و وظيفة البروتين',  count: 13 },
    { key: 'enzyme',          name: '⚗️ النشاط الإنزيمي للبروتينات',                          prefix: 'النشاط الانزيمي',                     count: 19 },
    { key: 'immunity',        name: '🛡️ دور البروتينات في الدفاع عن الذات (المناعة)',        prefix: 'المناعة',                             count: 58 },
    { key: 'nerves',          name: '⚡ دور البروتينات في الاتصال العصبي',                    prefix: 'الاعصاب',                             count: 90 },
    { key: 'photosynthesis',  name: '🌿 التركيب الضوئي',                                     prefix: 'التركيب الضوئي',                      count: 21 },
    { key: 'respiration',     name: '🫁 التنفس والتخمر',                                     prefix: 'التنفس',                              count: 44 },
    { key: 'tectonics',       name: '🌋 التكتونية العامة',                                   prefix: 'التكتونية',                           count: 55 }
];

var unitsWrap = document.getElementById('isUnits');
var lessonsEl = document.getElementById('isLessons');
var cards = [];

function buildCards() {
    UNITS.forEach(function (u) {
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'is-unit-card';
        btn.textContent = u.name;
        btn.dataset.key = u.key;
        btn.addEventListener('click', function () { openUnit(u); });
        unitsWrap.appendChild(btn);
        cards.push(btn);
    });
}

function toggleZoomBar(show) {
    var bar = document.getElementById('bacLessonZoomBar');
    if (bar) bar.style.display = show ? 'flex' : 'none';
}

function buildSources(u, plainName) {
    var list = [];
    for (var i = 1; i <= u.count; i++) {
        list.push({ src: 'I_science/' + u.prefix + i + '.jpg', alt: plainName + ' - تمرين ' + i });
    }
    return list;
}

function openUnit(u) {
    cards.forEach(function (c) { c.classList.toggle('active', c.dataset.key === u.key); });
    var h = document.querySelector('.hero h1');
    var pageName = h ? h.textContent.replace(/^[^\u0600-\u06FFA-Za-z0-9]+/, '').trim() : '';
    var plainName = u.name.replace(/^\S+\s/, '');
    var title = pageName ? pageName + ' — ' + plainName : plainName;
    window.bacOpenReader({ type: 'images', title: title, sources: buildSources(u, plainName), start: 0, fileName: title + '.pdf' });
}

function init() {
    buildCards();
    toggleZoomBar(false);
}

if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
} else {
    init();
}

})();
</script>
